name: Build and Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

jobs:
  # Stable tags must be on main, -rc.N tags on develop
  channel:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tag branch
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == *-rc.* ]]; then
            branch=develop prerelease=true
          else
            branch=main prerelease=false
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch"; then
            echo "::error::$TAG must point to a commit on $branch (push the branch before the tag)"
            exit 1
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  test:
    needs: channel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test D2Compare.slnx

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [win-x64, linux-x64]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish src/D2Compare.UI/D2Compare.csproj -r ${{ matrix.runtime }} --self-contained false -o publish/${{ matrix.runtime }}

      - name: Archive output (Windows)
        if: matrix.runtime == 'win-x64'
        env:
          TAG: ${{ github.ref_name }}
          RUNTIME: ${{ matrix.runtime }}
        run: cd publish/$RUNTIME && zip -r "../../D2Compare-${TAG}-${RUNTIME}.zip" .

      - name: Archive output (Linux)
        if: matrix.runtime == 'linux-x64'
        env:
          TAG: ${{ github.ref_name }}
          RUNTIME: ${{ matrix.runtime }}
        run: cd publish/$RUNTIME && tar -czf "../../D2Compare-${TAG}-${RUNTIME}.tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: D2Compare-${{ github.ref_name }}-${{ matrix.runtime }}
          path: |
            D2Compare-${{ github.ref_name }}-${{ matrix.runtime }}.zip
            D2Compare-${{ github.ref_name }}-${{ matrix.runtime }}.tar.gz

  appimage:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build AppImage
        env:
          TAG: ${{ github.ref_name }}
        run: packaging/appimage/build-appimage.sh "$TAG" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: D2Compare-${{ github.ref_name }}-x86_64-AppImage
          path: D2Compare-${{ github.ref_name }}-x86_64.AppImage

  release:
    needs: [channel, build, appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        if: needs.channel.outputs.prerelease == 'true'
        with:
          fetch-depth: 0

      # RC notes: raw commits since the previous rc tag (or last stable tag if none), newest first
      - name: RC release notes
        if: needs.channel.outputs.prerelease == 'true'
        env:
          TAG: ${{ github.ref_name }}
          NOTES: ${{ runner.temp }}/rc-notes.md
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*-rc.*' "$TAG^" 2>/dev/null \
            || git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          range=${prev:+$prev..}$TAG
          {
            echo "## Commits"
            echo
            git log --pretty='- %h %s' "$range"
            if [[ -n "$prev" ]]; then
              echo
              echo "**Full Changelog**: $REPO_URL/compare/$prev...$TAG"
            fi
          } > "$NOTES"
          cat "$NOTES"

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: ${{ needs.channel.outputs.prerelease != 'true' }}
          body_path: ${{ needs.channel.outputs.prerelease == 'true' && format('{0}/rc-notes.md', runner.temp) || '' }}
          prerelease: ${{ needs.channel.outputs.prerelease }}
          make_latest: ${{ needs.channel.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/**/*.AppImage
